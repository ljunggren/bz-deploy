---
uptime_checker_urls:
  - https://ai.boozang.com
  - https://eu.boozang.com
  - https://staging-bh.boozang.com

uptime_checker_slack_webhook: ""  # Set to your Slack webhook URL to enable notifications
uptime_checker_notify_email: ""   # Set to an email address to enable email alerts (requires mail command)

uptime_checker_timeout: 10        # curl timeout in seconds
uptime_checker_interval: "*/5 * * * *"  # cron schedule

uptime_checker_script_path: /usr/local/bin/uptime-check.sh
uptime_checker_log_path: /var/log/uptime-checker.log
